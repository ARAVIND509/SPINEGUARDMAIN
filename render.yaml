databases:
  - name: spineguard-db
    databaseName: spineguard
    user: spineguard
    plan: free

services:
  - type: web
    name: spineguard-ai
    env: python
    buildCommand: cd python-api && pip install -r requirements.txt
    startCommand: cd python-api && uvicorn ai_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0

  - type: web
    name: spineguard-web
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: spineguard-db
          property: connectionString
      - key: PYTHON_API_URL
        fromService:
          type: web
          name: spineguard-ai
          envVarKey: RENDER_INTERNAL_URL
      - key: NODE_ENV
        value: production
